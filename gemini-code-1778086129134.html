<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Vokabeltrainer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h1 { margin-top: 0; color: #2c3e50; }
        input[type="file"] { margin: 20px 0; }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #2980b9; }
        #quiz-section { display: none; }
        #feedback { font-weight: bold; margin-top: 15px; min-height: 48px; }
        .correct { color: #27ae60; }
        .almost-correct { color: #d35400; } /* Orange für fast richtige Antworten */
        .incorrect { color: #e74c3c; }
        #progress { margin-top: 20px; font-size: 14px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vokabeltrainer</h1>

    <div id="upload-section">
        <p>Lade eine Textdatei hoch (.txt oder .csv).<br>Format pro Zeile: <b>Wort,Übersetzung</b></p>
        <input type="file" id="fileInput" accept=".txt, .csv">
    </div>

    <div id="quiz-section">
        <h2 id="word-display">Lade Vokabeln...</h2>
        <input type="text" id="answer-input" placeholder="Deine Übersetzung..." autocomplete="off">
        <br>
        <button onclick="checkAnswer()">Prüfen</button>
        <p id="feedback"></p>
        <div id="progress"></div>
    </div>
</div>

<script>
    let vocabList = [];
    let currentIndex = 0;

    // Levenshtein-Distanz berechnen (zählt die Tippfehler)
    function getEditDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;

        const matrix = [];

        for (let i = 0; i <= b.length; i++) {
            matrix[i] = [i];
        }
        for (let j = 0; j <= a.length; j++) {
            matrix[0][j] = j;
        }

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1, // Ersetzen
                        Math.min(matrix[i][j - 1] + 1, // Einfügen
                                 matrix[i - 1][j] + 1) // Löschen
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    document.getElementById('fileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            parseVocabulary(content);
        };
        reader.readAsText(file);
    });

    function parseVocabulary(text) {
        const lines = text.split('\n');
        vocabList = [];

        for (let line of lines) {
            let parts = line.split(',');
            if (parts.length >= 2) {
                vocabList.push({ 
                    question: parts[0].trim(), 
                    answer: parts[1].trim() 
                });
            }
        }

        if (vocabList.length > 0) {
            vocabList.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            document.getElementById('upload-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            showNextWord();
        } else {
            alert('Keine gültigen Vokabeln gefunden. Bitte überprüfe das Format (Wort,Übersetzung).');
        }
    }

    function showNextWord() {
        if (currentIndex < vocabList.length) {
            document.getElementById('word-display').innerText = vocabList[currentIndex].question;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            updateProgress();
        } else {
            document.getElementById('word-display').innerText = "🎉 Alle Vokabeln geschafft!";
            document.getElementById('answer-input').style.display = 'none';
            document.querySelector('#quiz-section button').style.display = 'none';
            document.getElementById('feedback').innerText = '';
        }
    }

    function checkAnswer() {
        // Eingaben bereinigen (Leerzeichen am Rand weg, alles kleinbuchstaben)
        const userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
        const correctAnswer = vocabList[currentIndex].answer.toLowerCase();
        const feedbackEl = document.getElementById('feedback');

        // Berechne Tippfehler
        const distance = getEditDistance(userAnswer, correctAnswer);
        
        // Erlaubte Fehler basierend auf der Wortlänge
        let allowedDistance = 0;
        if (correctAnswer.length > 3 && correctAnswer.length <= 7) allowedDistance = 1;
        if (correctAnswer.length > 7) allowedDistance = 2;

        if (distance === 0) {
            // Exakt richtig
            feedbackEl.innerText = "Richtig! ✅";
            feedbackEl.className = "correct";
            currentIndex++;
            setTimeout(() => {
                feedbackEl.innerText = "";
                showNextWord();
            }, 1000);
        } else if (distance <= allowedDistance) {
            // Fast richtig (Tippfehler verziehen)
            feedbackEl.innerHTML = `Fast perfekt! ✅<br><small>Die exakte Schreibweise ist: <b>${vocabList[currentIndex].answer}</b></small>`;
            feedbackEl.className = "almost-correct";
            currentIndex++;
            setTimeout(() => {
                feedbackEl.innerText = "";
                showNextWord();
            }, 2500); // Etwas länger warten, damit man die richtige Schreibweise lesen kann
        } else {
            // Falsch
            feedbackEl.innerHTML = `Falsch! ❌<br><small>Die richtige Antwort ist: <b>${vocabList[currentIndex].answer}</b></small>`;
            feedbackEl.className = "incorrect";
            vocabList.push(vocabList[currentIndex]);
            currentIndex++;
            setTimeout(() => {
                feedbackEl.innerText = "";
                showNextWord();
            }, 2500);
        }
    }

    function updateProgress() {
        document.getElementById('progress').innerText = `Vokabel ${currentIndex + 1} von ${vocabList.length}`;
    }

    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });
</script>

</body>
</html>
