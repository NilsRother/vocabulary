<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeltrainer Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        h1 { color: #1a73e8; margin-bottom: 30px; }
        input[type="file"] { margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #1a73e8; }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #1557b0; }
        #quiz-section { display: none; }
        #feedback { 
            font-weight: 500; 
            margin-top: 20px; 
            min-height: 60px;
            line-height: 1.4;
        }
        .correct { color: #2ecc71; }
        .almost-correct { color: #f39c12; }
        .incorrect { color: #e74c3c; }
        #progress { margin-top: 25px; font-size: 14px; color: #666; border-top: 1px solid #eee; padding-top: 15px; }
        small { display: block; margin-top: 5px; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vokabeltrainer</h1>

    <div id="upload-section">
        <p>Lade deine Vokabelliste hoch (.txt / .csv)</p>
        <input type="file" id="fileInput" accept=".txt, .csv">
        <p style="font-size: 0.8em; color: #888;">Format: Wort, Übersetzung 1; Übersetzung 2</p>
    </div>

    <div id="quiz-section">
        <h2 id="word-display">...</h2>
        <input type="text" id="answer-input" placeholder="Antwort eingeben..." autocomplete="off">
        <button onclick="checkAnswer()">Prüfen</button>
        <p id="feedback"></p>
        <div id="progress"></div>
    </div>
</div>

<script>
    let vocabList = [];
    let currentIndex = 0;

    // Distanz-Algorithmus für Tippfehler
    function getEditDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
                else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
            }
        }
        return matrix[b.length][a.length];
    }

    document.getElementById('fileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => parseVocabulary(e.target.result);
        reader.readAsText(file);
    });

    function parseVocabulary(text) {
        const lines = text.split('\n');
        vocabList = [];
        for (let line of lines) {
            let parts = line.split(',');
            if (parts.length >= 2) {
                vocabList.push({ question: parts[0].trim(), answer: parts[1].trim() });
            }
        }
        if (vocabList.length > 0) {
            vocabList.sort(() => Math.random() - 0.5);
            document.getElementById('upload-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            showNextWord();
        }
    }

    function showNextWord() {
        if (currentIndex < vocabList.length) {
            document.getElementById('word-display').innerText = vocabList[currentIndex].question;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            updateProgress();
        } else {
            document.getElementById('word-display').innerText = "Geschafft! 🏆";
            document.getElementById('answer-input').style.display = 'none';
            document.querySelector('button').style.display = 'none';
        }
    }

    function checkAnswer() {
        const userIn = document.getElementById('answer-input').value.trim().toLowerCase();
        const fullAnswer = vocabList[currentIndex].answer;
        
        // Trenne die richtigen Antworten an Semikolon oder Schrägstrich
        const possibleAnswers = fullAnswer.split(/[;/]/).map(s => s.trim().toLowerCase());
        
        let bestMatch = { distance: 999, word: "" };

        // Suche die am nächsten liegende korrekte Teil-Antwort
        possibleAnswers.forEach(alt => {
            const dist = getEditDistance(userIn, alt);
            if (dist < bestMatch.distance) {
                bestMatch = { distance: dist, word: alt };
            }
        });

        const feedbackEl = document.getElementById('feedback');
        let allowedDist = bestMatch.word.length > 7 ? 2 : (bestMatch.word.length > 3 ? 1 : 0);

        if (bestMatch.distance === 0) {
            feedbackEl.innerHTML = "<span class='correct'>Richtig! ✅</span>";
            if (possibleAnswers.length > 1) feedbackEl.innerHTML += `<br><small>Auch richtig: ${fullAnswer}</small>`;
            advance();
        } else if (bestMatch.distance <= allowedDist) {
            feedbackEl.innerHTML = `<span class='almost-correct'>Fast richtig! (Tippfehler) ✅</span><br><small>Gemeint war: <b>${fullAnswer}</b></small>`;
            advance();
        } else {
            feedbackEl.innerHTML = `<span class='incorrect'>Leider falsch! ❌</span><br><small>Korrekte Lösung: <b>${fullAnswer}</b></small>`;
            vocabList.push(vocabList[currentIndex]); // Wort wiederholen
            advance();
        }
    }

    function advance() {
        currentIndex++;
        setTimeout(() => {
            document.getElementById('feedback').innerHTML = "";
            showNextWord();
        }, 2500);
    }

    function updateProgress() {
        document.getElementById('progress').innerText = `Vokabel ${currentIndex + 1} von ${vocabList.length}`;
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>

</body>
</html>
